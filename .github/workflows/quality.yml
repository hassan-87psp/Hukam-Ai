name: HUKM AI - Quality and Security Checks

on:
  push:
    branches: [main, hukm-comprehensive-v11-audit]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_verified_release:
        description: 'Publish only after documented owner acceptance and rollback verification'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hukm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-relay-tests:
    name: TypeScript / build / relay integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev
      - name: Audit production dependencies for high/critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - name: Verify release version and package contract
        run: node scripts/check-release-version.mjs
      - run: npm test
      # Mirror Render's production build path, including the root prebuild.
      # Optional voice preview must never be able to abort deployment.
      - run: npm run build

  windows-controller-tests:
    name: Windows controller (simulated, no laptop commands)
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/windows-controller/requirements-dev.txt
            apps/windows-controller/requirements.txt
            apps/windows-controller/constraints-windows-py312.txt
      - run: npm ci --include=dev
      - run: python -m pip install -r apps/windows-controller/requirements-dev.txt
      - name: Python syntax check
        run: python -m compileall -q apps/windows-controller/controller
      - name: Build local relay before controller E2E (avoid missing-dist skip)
        run: npm run build -w apps/relay
      - name: Controller unit and local relay E2E
        env:
          HUKM_SIMULATE: "1"
        run: python -m pytest -q apps/windows-controller/tests
      - name: Build portable Windows Controller (no installer/auto-run)
        working-directory: apps/windows-controller
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/hukm-controller.spec
      - name: Smoke test frozen EXE entry point (real Windows, no controller connection)
        shell: pwsh
        working-directory: apps/windows-controller
        run: |
          $ErrorActionPreference = 'Stop'
          & .\dist\hukm-controller.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Frozen EXE --version failed" }
          & .\dist\hukm-controller.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Frozen EXE --help failed" }
          & .\dist\hukm-controller.exe status | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Frozen EXE status failed" }
      - name: Smoke test frozen read-only OCR child on synthetic image
        working-directory: apps/windows-controller
        run: python tests/smoke_frozen_ocr.py
      - name: Publish ONE consolidated Windows installer ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item apps/windows-controller/dist/hukm-controller.exe release/hukm-controller.exe
          Copy-Item apps/windows-controller/README.md release/README.txt
          Copy-Item apps/windows-controller/packaging/*.cmd release/
          Copy-Item apps/windows-controller/packaging/ONE_ZIP_SETUP.txt release/
          Compress-Archive -Path release/* -DestinationPath HUKM-Windows-Controller-v1.9.0.zip -Force
      - name: Smoke test consolidated installer in isolated sandbox
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'hukm-isolated-appdata'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          # CI=true skips prompts in installer, while user launches remain interactive.
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'release\\INSTALL_OR_UPDATE.cmd' -NoNewWindow -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\\hukm-installer-out.txt"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\\hukm-installer-out.txt"; throw "Installer failed" }
          $exe = Join-Path $env:LOCALAPPDATA 'HUKM AI\\Controller\\hukm-controller.exe'
          if (!(Test-Path $exe)) { throw "Installed EXE missing" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "Installed EXE failed" }
      - name: Build one-file HUKM Setup EXE (unsigned test build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup could not be installed' }
          }
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler missing' }
          & $compiler 'apps/windows-controller/packaging/HUKM-Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw 'HUKM one-file setup compilation failed' }
          if (!(Test-Path 'HUKM-Setup-v1.9.0.exe')) { throw 'One-file setup executable missing' }
      - name: Smoke test one-file setup in isolated Windows profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'hukm-one-time-install'
          $setup = Join-Path $PWD 'HUKM-Setup-v1.9.0.exe'
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $target + '"'))
          $p = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "One-time setup returned $($p.ExitCode)" }
          $exe = Join-Path $target 'hukm-controller.exe'
          if (!(Test-Path $exe)) { throw 'One-time setup did not install the EXE' }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed one-time EXE version check failed' }
          & $exe status | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'One-time EXE status check failed' }
          # Repeat installation in the same isolated directory to confirm backup
          # and local recovery work without altering pairing or starting a device.
          $original = (Get-FileHash $exe -Algorithm SHA256).Hash
          $p = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Repeat setup failed: $($p.ExitCode)" }
          $previous = Join-Path $target 'hukm-controller.previous.exe'
          if (!(Test-Path $previous) -or (Get-FileHash $previous -Algorithm SHA256).Hash -ne $original) {
            throw 'Prior executable backup missing or changed'
          }
          $recovery = Join-Path $target 'RESTORE_PREVIOUS.cmd'
          if (!(Test-Path $recovery)) { throw 'Local recovery helper missing' }
          $p = Start-Process -FilePath $env:ComSpec -ArgumentList @('/c', ('"' + $recovery + '"')) -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Get-FileHash $exe -Algorithm SHA256).Hash -ne $original) {
            throw 'Local recovery smoke failed'
          }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\HUKM*.lnk") {
            throw 'Installer unexpectedly created an Autostart entry'
          }
      - name: Generate installer SHA-256 integrity checksum
        shell: pwsh
        run: |
          $zip = 'HUKM-Windows-Controller-v1.9.0.zip'
          if (!(Test-Path $zip)) { throw 'HUKM installer ZIP missing' }
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Path "$zip.sha256" -Encoding ascii
          if (!(Test-Path "$zip.sha256")) { throw 'HUKM installer checksum missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: HUKM-Windows-Controller-v1.9.0
          path: |
            HUKM-Windows-Controller-v1.9.0.zip
            HUKM-Windows-Controller-v1.9.0.zip.sha256
          retention-days: 14
          if-no-files-found: error
      - name: SHA-256 one-file setup checksum
        shell: pwsh
        run: |
          $file = 'HUKM-Setup-v1.9.0.exe'
          $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $file" | Set-Content -Path "$file.sha256" -Encoding ascii
          if (!(Test-Path "$file.sha256")) { throw 'Standalone EXE checksum missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: HUKM-One-Time-Setup-v1.9.0
          path: |
            HUKM-Setup-v1.9.0.exe
            HUKM-Setup-v1.9.0.exe.sha256
          retention-days: 14
          if-no-files-found: error

  official-windows-release:
    name: Publish official versioned setup (main, after all tests)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_verified_release == true
    needs: [web-relay-tests, windows-controller-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HUKM-One-Time-Setup-v1.9.0
          path: setup-release
      - uses: actions/download-artifact@v4
        with:
          name: HUKM-Windows-Controller-v1.9.0
          path: zip-release
      - name: Publish only one immutable tag for this verified version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v1.9.0'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Never replace update assets or checksums."
            exit 0
          fi
          test -s "setup-release/HUKM-Setup-v1.9.0.exe"
          test -s "setup-release/HUKM-Setup-v1.9.0.exe.sha256"
          test -s "zip-release/HUKM-Windows-Controller-v1.9.0.zip"
          cd setup-release
          sha256sum --check HUKM-Setup-v1.9.0.exe.sha256
          cd ../zip-release
          sha256sum --check HUKM-Windows-Controller-v1.9.0.zip.sha256
          cd ..
          gh release create "$tag" \
            setup-release/HUKM-Setup-v1.9.0.exe \
            setup-release/HUKM-Setup-v1.9.0.exe.sha256 \
            zip-release/HUKM-Windows-Controller-v1.9.0.zip \
            zip-release/HUKM-Windows-Controller-v1.9.0.zip.sha256 \
            --target "$GITHUB_SHA" --title "HUKM AI v1.9.0" \
            --notes "Official owner-approved HUKM Windows Controller setup. Unattended auto-install is disabled. The unsigned installer requires local Windows confirmation. Existing pairing remains intact; verify controller version after reconnect."
