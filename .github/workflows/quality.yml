name: HUKM AI - Quality and Security Checks

on:
  push:
    branches: [main, hukm-comprehensive-v11-audit]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hukm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-relay-tests:
    name: TypeScript / build / relay integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      # Build already-installed workspaces; the root prebuild installs a
      # best-effort third-party online TTS preview and can hit npm ETARGET.
      # Production Render still runs the full install and startup checks.
      - run: npm run build -w apps/web && npm run build -w apps/relay

  windows-controller-tests:
    name: Windows controller (simulated, no laptop commands)
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/windows-controller/requirements-dev.txt
      - run: npm ci --include=dev
      - run: python -m pip install -r apps/windows-controller/requirements-dev.txt
      - name: Python syntax check
        run: python -m compileall -q apps/windows-controller/controller
      - name: Controller unit and local relay E2E
        env:
          HUKM_SIMULATE: "1"
        run: python -m pytest -q apps/windows-controller/tests
      - name: Build portable Windows Controller (no installer/auto-run)
        working-directory: apps/windows-controller
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/hukm-controller.spec
      - name: Smoke test frozen EXE entry point (real Windows, no controller connection)
        shell: pwsh
        working-directory: apps/windows-controller
        run: |
          $ErrorActionPreference = 'Stop'
          & .\dist\hukm-controller.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Frozen EXE --version failed" }
          & .\dist\hukm-controller.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Frozen EXE --help failed" }
          & .\dist\hukm-controller.exe status | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Frozen EXE status failed" }
      - name: Publish ONE consolidated Windows installer ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item apps/windows-controller/dist/hukm-controller.exe release/hukm-controller.exe
          Copy-Item apps/windows-controller/README.md release/README.txt
          Copy-Item apps/windows-controller/packaging/*.cmd release/
          Copy-Item apps/windows-controller/packaging/ONE_ZIP_SETUP.txt release/
          Compress-Archive -Path release/* -DestinationPath HUKM-Windows-Controller-v1.5.0.zip -Force
      - name: Smoke test consolidated installer in isolated sandbox
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'hukm-isolated-appdata'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          # CI=true skips prompts in installer, while user launches remain interactive.
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'release\\INSTALL_OR_UPDATE.cmd' -NoNewWindow -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\\hukm-installer-out.txt"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\\hukm-installer-out.txt"; throw "Installer failed" }
          $exe = Join-Path $env:LOCALAPPDATA 'HUKM AI\\Controller\\hukm-controller.exe'
          if (!(Test-Path $exe)) { throw "Installed EXE missing" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "Installed EXE failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: HUKM-Windows-Controller-v1.5.0
          path: HUKM-Windows-Controller-v1.5.0.zip
          retention-days: 14
          if-no-files-found: error
