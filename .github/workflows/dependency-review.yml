name: HUKM dependency review and update candidate

on:
  pull_request:
    paths:
      - '.github/workflows/dependency-review.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**/package.json'
      - 'apps/windows-controller/requirements*.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hukm-dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect complete dependency advisory report
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/hukm-before.json" || true
          node - "$RUNNER_TEMP/hukm-before.json" <<'NODE'
          const r = require(process.argv[2]);
          if (r.error || !r.metadata?.vulnerabilities || !r.vulnerabilities) throw Error('npm audit unavailable');
          console.log(JSON.stringify({counts:r.metadata.vulnerabilities,findings:Object.entries(r.vulnerabilities).map(([name,v])=>({name, severity:v.severity,via:v.via,fixAvailable:v.fixAvailable}))}));
          NODE
      - name: Generate dependency update candidate without forced upgrades
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json "$RUNNER_TEMP/hukm-original-lock.json"
          # Vite 7 supports the existing React plugin and avoids a bundler migration.
          # All chosen versions are tested in this isolated candidate.
          node <<'NODE'
          const fs = require('fs');
          const update = (path, versions) => {
            const p = JSON.parse(fs.readFileSync(path, 'utf8'));
            Object.assign(p.devDependencies, versions);
            fs.writeFileSync(path, JSON.stringify(p,null,2)+'\n');
          };
          update('package.json', {vitest:'5.1.1',vite:'7.3.8'});
          update('apps/web/package.json', {vite:'7.3.8','@vitejs/plugin-react':'4.7.0'});
          update('apps/relay/package.json', {esbuild:'0.28.2'});
          NODE
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm audit --json > "$RUNNER_TEMP/hukm-after.json" || true
          node - "$RUNNER_TEMP/hukm-original-lock.json" "$RUNNER_TEMP/hukm-after.json" <<'NODE'
          const fs = require('fs');
          const old = require(process.argv[2]), next = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const report = require(process.argv[3]);
          if (report.error || !report.metadata?.vulnerabilities) throw Error('Candidate audit unavailable');
          const changes = Object.fromEntries(Object.entries(next.packages).filter(([k,v])=>JSON.stringify(v)!==JSON.stringify(old.packages[k])));
          const removed = Object.keys(old.packages).filter(k=>!(k in next.packages));
          console.log('HUKM_LOCK_DELTA '+JSON.stringify({changes,removed,root:Object.fromEntries(Object.entries(next).filter(([k])=>k!=='packages'))}));
          for (const path of ['package.json','apps/web/package.json','apps/relay/package.json','apps/web/vite.config.ts']) {
            console.log('HUKM_MANIFEST '+JSON.stringify({path,content:fs.readFileSync(path,'utf8')}));
          }
          console.log('HUKM_AUDIT_AFTER '+JSON.stringify({counts:report.metadata.vulnerabilities,findings:Object.entries(report.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,via:v.via,fixAvailable:v.fixAvailable}))}));
          NODE
      - name: Test proposed lockfile and routing upgrade
        run: |
          npm ci --include=dev
          npm run typecheck
          npm test
          npm run build
      - name: Require a clean candidate dependency audit
        run: npm audit --audit-level=low
  python-review:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve exact Windows dependency versions in isolation
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/hukm-runtime"
          $runtime = "$env:RUNNER_TEMP/hukm-runtime/Scripts/python.exe"
          & $runtime -m pip install -r apps/windows-controller/requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
          & $runtime -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Dependency resolution conflict" }
          & $runtime -m pip freeze | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/hukm-resolved.txt"
          Get-Content "$env:RUNNER_TEMP/hukm-resolved.txt"
      - name: Audit resolved Python packages with separate free audit environment
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/hukm-auditor"
          $audit = "$env:RUNNER_TEMP/hukm-auditor/Scripts/python.exe"
          & $audit -m pip install pip-audit
          if ($LASTEXITCODE -ne 0) { throw "Audit tool installation failed" }
          & $audit -m pip_audit --disable-pip --no-deps -r "$env:RUNNER_TEMP/hukm-resolved.txt" --format json
          if ($LASTEXITCODE -ne 0) { throw "Python dependency audit is not clean" }
